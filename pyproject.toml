[project]
name = "poe2market-mcp"
version = "0.1.0"
description = "MCP access point for Path of Exile 2 market data: live prices, per-league history, stash valuation, and trade preparation."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tomli-w>=1.0",
    "keyring>=25.0",
]

[project.scripts]
poe2market = "poe2market.cli:main"
poe2market-mcp = "poe2market.mcp.server:main"
poe2market-collector = "poe2market.collect.daemon:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poe2market"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# F = pyflakes (dead code/unused), E/W = pycodestyle. E731 (lambda) allowed.
select = ["F", "E", "W"]
ignore = ["E731"]
