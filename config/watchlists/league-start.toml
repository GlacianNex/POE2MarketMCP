name = "league-start"
description = """
High-demand items in the first days of a league, when prices move hourly and
the early-mover advantage is largest. Raise the cadence at league start and
disable this list once prices settle (enabled = false)."""
enabled = false
cadence_minutes = 20
priority = 10

# 20-minute cadence is aggressive: 6 targets x 3 passes/hour = ~36 searches/hour.
# The search budget is 600 per 6h (100/hour), so keep this list short.

[[target]]
key = "ls:astramentis"
label = "Astramentis (early stat stick)"
kind = "unique"
name = "Astramentis"
type = "Stellar Amulet"
sample_size = 10

